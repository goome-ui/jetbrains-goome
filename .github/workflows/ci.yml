name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: goome sources
        run: |
          mkdir -p deps
          for r in docs c-goome goome-cli vscode-goome; do
            git clone -q --depth 1 "https://github.com/goome-ui/$r.git" "deps/$r"
          done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: build
        run: ./gradlew --no-daemon buildPlugin
      - name: tests
        run: ./gradlew --no-daemon test
      - uses: actions/upload-artifact@v6
        if: always() && failure()
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          name: jetbrains-goome-zip
          path: build/distributions/*.zip

  verify:
    strategy:
      fail-fast: false
      matrix:
        ide: ['IC:2024.3.6', 'IU:2026.3', 'RD:2024.3.10', 'RD:2026.3', 'PY:2026.3', 'CL:2026.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: goome sources
        run: |
          mkdir -p deps
          for r in docs c-goome; do
            git clone -q --depth 1 "https://github.com/goome-ui/$r.git" "deps/$r"
          done
      - name: make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: plugin verifier
        run: ./gradlew --no-daemon verifyPlugin -PverifyIde=${{ matrix.ide }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verifier-${{ strategy.job-index }}
          path: build/reports/pluginVerifier
